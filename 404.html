<title>Page not found — The Weekly Hallucination</title>
<script>
  // Old daily issues used to live at the site root (/YYYY-MM-DD.html). They now live in /daily/.
  (function () {
    var m = location.pathname.match(/^(.*\/)(\d{4}-\d{2}-\d{2})\.html$/);
    if (m && !/\/(daily|weekly)\/$/.test(m[1])) {
      location.replace(m[1] + 'daily/' + m[2] + '.html' + location.search + location.hash);
    }
  })();
</script>
