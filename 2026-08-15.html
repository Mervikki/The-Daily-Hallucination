<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Daily Hallucination – Saturday, August 15, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F5F0E8;
    color: #0D0D0D;
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1.5;
    padding: 24px 16px 60px;
  }
  .paper {
    max-width: 920px;
    margin: 0 auto;
    background: #ffffff;
    padding: 36px 44px 44px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  /* ---------- MASTHEAD ---------- */
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 3.4rem;
    line-height: 1.02;
    color: #0D0D0D;
  }
  .masthead .accent { border: none; border-top: 4px solid #C0392B; width: 56px; margin: 10px auto 0; }
  .masthead .rule3 { border: none; border-top: 3px solid #0D0D0D; margin: 8px auto 0; }
  .masthead .tagline { font-style: italic; color: #888888; font-size: 0.95rem; margin-top: 8px; }
  .masthead .thin { border: none; border-top: 1px solid #cccccc; margin: 8px auto; }
  .masthead .dateline {
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.7rem;
    color: #888888;
  }
  /* ---------- TODAY AT A GLANCE ---------- */
  .glance { width: 100%; border-collapse: collapse; margin: 28px 0 30px; font-family: 'Source Serif 4', serif; }
  .glance th {
    background: #1a2744; color: #ffffff;
    font-family: 'Inter', sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.16em;
    font-size: 0.74rem; text-align: left; padding: 9px 12px;
  }
  .glance td { background: #F5F0E8; padding: 8px 12px; font-size: 0.86rem; border-bottom: 2px solid #ffffff; vertical-align: top; }
  .glance td.topic {
    font-weight: 700; font-family: 'Inter', sans-serif;
    font-size: 0.74rem; text-transform: uppercase;
    letter-spacing: 0.04em; width: 150px; color: #1a2744;
  }
  .spark { display: inline-block; vertical-align: middle; margin-left: 4px; }
  /* ---------- TWO-COLUMN BODY ---------- */
  .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .body-grid > .col:first-child { padding-right: 26px; border-right: 1px solid #cccccc; }
  .body-grid > .col:last-child { padding-left: 26px; }
  .col article { margin-bottom: 26px; }
  .col article:last-child { margin-bottom: 0; }
  .section-label {
    display: inline-block; background: #1a2744; color: #ffffff;
    font-family: 'Inter', sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 0.62rem; padding: 3px 7px; margin-bottom: 7px;
  }
  .hl { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.4rem; line-height: 1.16; margin-bottom: 5px; }
  .sh { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.93rem; line-height: 1.25; margin-bottom: 5px; }
  .byline { font-family: 'Inter', sans-serif; font-style: italic; font-size: 0.72rem; color: #888888; margin-bottom: 8px; }
  .col p.body { font-size: 0.88rem; text-align: justify; hyphens: auto; -webkit-hyphens: auto; margin-bottom: 8px; }
  p.opinion {
    font-style: italic; border-left: 2px solid #dddddd;
    padding-left: 12px; margin: 8px 0 8px 8px; font-size: 0.86rem;
  }
  .pullquote {
    background: #F5F0E8; border: 1px solid #C0392B; border-left: 4px solid #C0392B;
    color: #C0392B; font-style: italic; text-align: center;
    font-size: 0.98rem; line-height: 1.35; padding: 12px 16px; margin: 12px 0;
  }
  .pullquote .attr { display: block; font-size: 0.72rem; font-style: normal; margin-top: 6px; letter-spacing: 0.03em; }
  .chartwrap { margin: 12px 0; }
  .chartwrap svg { width: 100%; height: auto; display: block; }
  .chart-caption { font-style: italic; font-size: 0.72rem; color: #888888; margin-top: 3px; }
  .chart-title {
    font-family: 'Inter', sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    font-size: 0.64rem; color: #1a2744; margin-bottom: 4px;
  }
  /* ---------- OBIT / FEATURE BOX ---------- */
  .obit { background: #fbfaf7; border: 1px solid #ddd6c8; border-top: 3px solid #C0392B; padding: 14px 18px; }
  .obit .dates { font-family: 'Inter', sans-serif; font-size: 0.68rem; letter-spacing: 0.04em; color: #888888; text-transform: uppercase; margin-bottom: 6px; }
  .obit .term { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; }
  .obit .deftag { font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.6rem; color: #1a2744; margin-top: 8px; }
  .obit p.body { font-size: 0.86rem; text-align: justify; hyphens: auto; -webkit-hyphens: auto; margin-top: 4px; }
  /* ---------- EDITOR'S NOTE ---------- */
  .editors { background: #1a2744; color: #f3efe6; padding: 22px 26px; margin: 30px 0 0; }
  .editors .section-label { background: #C0392B; color: #ffffff; }
  .editors p { font-family: 'Source Serif 4', serif; font-style: italic; font-size: 0.92rem; line-height: 1.55; margin-bottom: 9px; }
  .editors p:last-child { margin-bottom: 0; }
  .editors .sign { font-style: italic; color: #b9c2d6; }
  /* ---------- CORRECTIONS ---------- */
  .corrections { background: #f1f1f1; border: 1px solid #cccccc; padding: 12px 16px; margin: 22px 0 0; font-size: 0.82rem; }
  .corrections .clabel { font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.62rem; color: #C0392B; margin-bottom: 5px; }
  .corrections p { margin-bottom: 6px; font-style: italic; }
  .corrections p:last-child { margin-bottom: 0; }
  /* ---------- FOOTER ---------- */
  .footer {
    border-top: 1px solid #0D0D0D; margin-top: 30px; padding-top: 12px;
    text-align: center; font-family: 'Inter', sans-serif;
    text-transform: uppercase; letter-spacing: 0.14em;
    font-size: 0.62rem; color: #888888;
  }
  @media (max-width: 680px) {
    .paper { padding: 24px 18px 30px; }
    .masthead h1 { font-size: 2.1rem; }
    .body-grid { grid-template-columns: 1fr; }
    .body-grid > .col:first-child {
      padding-right: 0; border-right: none;
      border-bottom: 1px solid #cccccc;
      padding-bottom: 26px; margin-bottom: 26px;
    }
    .body-grid > .col:last-child { padding-left: 0; }
  }
</style>
</head>
<body>
<div class="paper">
  <!-- CONTENT PENDING -->
</div>
</body>
</html>
